name: package

# FULL upstream sync round N+2: official device main + official framework main
# + sm8550 SoC pin bump (a9f45dc6 -> SoC main 2dc650ca: GeniUart/QupDma/VideoCc/AppsSmmu),
# + PR #229 cherry-pick, + the sheng ABL 0x218 DTB fix, + build-logs upload,
# + restore the 27 profile's default prelink roots (run 43528673031 layout fix).
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and
# is baked into the images, so the run's artifacts belong to one device alone:
# download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU-sheng
          ref: 68800685763d755c368775b848dd703fb3f8a3ce # official device main (full upstream sync)
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: d8210e089792946841ca23a8ff39f3b3641b002f # official framework main (full upstream sync)
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          ref: 66421cb7bb5694843aec8de1ca3d1de4c20cca38 # pinned: uefi-sheng main, unchanged since 2026-11-01
          path: uefi-sheng
          submodules: recursive
      - name: bump sm8550 SoC pin (Sm8550GeniUart.h requirement)
        # ROOT CAUSE (runs 43375570118 / 43388561958): device main's feeds.toml and
        # unixnu.lock pin SoC a9f45dc6, whose kits/Sm8550Platform lacks everything the
        # device build compiles - Sm8550GeniUart.h/.c (BluetoothProbe), Sm8550QupDma,
        # Sm8550VideoCc (video clock, H264) and Sm8550AppsSmmu. SoC main 2dc650ca has
        # all four; every file the build references is checked by preflight.
        run: |
          python3 - <<'PY'
          import pathlib
          OLD = 'a9f45dc60c035084b95463781538380f4c3606c9'
          NEW = '2dc650ca76ae38715cd0712e60a44b14fe251745'
          for rel in ('device/feeds.toml', 'device/unixnu.lock'):
              p = pathlib.Path(rel)
              t = p.read_text()
              if OLD in t:
                  p.write_text(t.replace(OLD, NEW))
                  print(rel + ': SoC pin ' + OLD[:8] + ' -> ' + NEW[:8])
              elif NEW in t:
                  print(rel + ': already on ' + NEW[:8])
              else:
                  raise SystemExit(rel + ': unexpected SoC pin; inspect feeds.toml')
          PY
      - name: compile native board objects with -Oz (layout slack)
        # MEASURED (run 43571646791 + baseline kernel.macho of run 43449862147):
        # the native code window is __DATA.va - align(max end of retained
        # kext __TEXT_EXEC). Baseline measured: window 11968 KiB, used 11792 KiB,
        # slack 160 KiB. The failing run's native kernel has 57354 function_starts
        # vs 56199 in the proven baseline: +1155 functions ~= +242 KiB at the
        # measured 215 B/function, over the 160 KiB slack -> fileset_layout.py:115
        # "Native code would collide with collection data". The recipe used by
        # compile_cpp/compile_c is -O2 (1085 hits in runtime.log). The official
        # builder already answers the same pressure: build-gop-legacy-display-27.py
        # line 735 compiles the VPU objects with '-Os' and the comment
        # "native text is short of room". Extend that official remedy to every
        # board object compiled by this script; -Oz over -O2 frees enough text (run 43590888494: -Os still collided, over_by=0x20000)
        # to cover the ~82 KiB deficit without touching upstream sources or roots.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/scripts/build-gop-legacy-display-27.py')
          t = p.read_text()
          anchor = "    cmd += ['-Wall', '-Wextra', '-Werror', '-Wno-unused-parameter', '-Wno-unnecessary-virtual-specifier', '-Wno-c99-designator',\n            '-Wno-reorder-init-list', '-Wno-deprecated-enum-enum-conversion', '-I', str(ROOT / '.cache/xnu-work/osfmk'), *extra]"
          assert t.count(anchor) == 1, 'compile_cpp anchor not unique: %d' % t.count(anchor)
          new = anchor.replace("*extra]", "*extra, '-Oz', '-fno-asynchronous-unwind-tables', '-fno-unwind-tables'")
          t = t.replace(anchor, new, 1)
          assert new in t, 'compile_cpp replacement did not land'
          anchor_c = "    cmd += ['-Wall', '-Wextra', '-Werror', '-mgeneral-regs-only', '-I', str(ROOT / '.cache/xnu-work/osfmk'), '-I', str(ROOT / 'kits/sheng')]"
          assert t.count(anchor_c) == 1, 'compile_c anchor not unique: %d' % t.count(anchor_c)
          new_c = anchor_c.replace("'-I', str(ROOT / 'kits/sheng')]", "'-I', str(ROOT / 'kits/sheng'), '-Oz', '-fno-asynchronous-unwind-tables', '-fno-unwind-tables']")
          t = t.replace(anchor_c, new_c, 1)
          assert new_c in t, 'compile_c replacement did not land'
          p.write_text(t)
          print('build-gop-legacy-display-27.py: compile_cpp and compile_c now emit -Oz')
          PY
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path('device/scripts/build-gop-legacy-display-27.py').read_text()
          import re
          n = len(re.findall(r"-Os\b", t)) + len(re.findall(r"-Oz\b", t))
          assert n >= 3, 'expected at least 3 -Os/-Oz tokens (2 patched -Oz + 1 official VPU -Os), got %d' % n
          assert t.count('-fno-asynchronous-unwind-tables') >= 2, 'no-unwind flags not landed: %d' % t.count('-fno-asynchronous-unwind-tables')
          assert "*extra, '-Oz'" in t and "kits/sheng'), '-Oz'" in t, 'patched -Oz anchors missing'
          import ast
          ast.parse(t)
          print('assertion ok: -Os/-Oz tokens =', n, '; anchors applied; script parses')
          PY
      - name: layout collide diagnostics (print numbers before the exception)
        # Runs 43571646791 and 43586156184 both died at fileset_layout.py:115 with
        # no numbers on the page. Patch the framework's Layout to print
        # __DATA.va, code_end, over_by and native __TEXT_EXEC size at the exact
        # collision branch, so the next failure (or success) carries the real
        # budget numbers. Pure diagnostics: the success path is untouched.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/kits/XnuPrelink/fileset_layout.py')
          t = p.read_text()
          old = "        if code_end > self.roots['__DATA']['va']:\n            raise ValueError('Native code would collide with collection data')"
          assert t.count(old) == 1, 'collide branch not unique: %d' % t.count(old)
          new = ("        if code_end > self.roots['__DATA']['va']:\n"
                 "            print(f'LAYOUT COLLIDE: __DATA.va={self.roots[\"__DATA\"][\"va\"]:#x} code_end={code_end:#x} '\n"
                 "                  f'over_by={code_end - self.roots[\"__DATA\"][\"va\"]:#x} native_text_exec={next(s for s in self.native.segments if s[\"name\"] == \"__TEXT_EXEC\")[\"size\"]:#x}')\n"
                 "            raise ValueError('Native code would collide with collection data')")
          t = t.replace(old, new, 1)
          assert 'LAYOUT COLLIDE' in t and t.count(old) == 0
          import ast
          ast.parse(t)
          p.write_text(t)
          print('layout diagnostics patched')
          PY
      - name: device hook weak stubs (macOS-only hooks; real hooks force-pulled)
        # PIT (run 43406736873): the DEVELOPMENT kernel link fails on 16 weak imports.
        # They are NOT all macOS-only. Verified against the sources:
        #   * 7 hooks HAVE real implementations (device SourceStorage.cpp:264,
        #     SourceRootBinding.cpp:68, BootWatchdogPolicy.c:95; framework
        #     drivers/RamBlock/NativeRamBlock.cpp:693/712). They are the UFS/root
        #     start path (bsd_init, kern_exec, IOKitBSDInit call them); stubbing
        #     them would disable SourceStorage and root verification, so instead
        #     force the linker to pull their archive members with -u.
        #   * 9 are genuinely macOS-only or optional: cs_native4k_* (CS digest
        #     timing, BootLog.c declares them as weak_import arrays), the
        #     memwired/pager-close hooks from the macOS 27.3 profile patches, the
        #     legacy request layout table (has the ios17 fallback), and the
        #     macOS-only Ethernet / software AES probes (LegacyDisplayProbe.cpp
        #     itself comments them "macOS builds only"). arm64e cannot leave an
        #     authenticated pointer to an undefined weak symbol, so these get
        #     weak defaults (project convention).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          # macOS-only hooks. The default must reproduce the ABSENT-hook path,
          # a wrong value silently changes behaviour:
          #   * iokit_physical_descriptor_close_notify is an existence probe:
          #     tracked_ = hook && call(...) == KERN_SUCCESS, and KERN_SUCCESS is 0,
          #     so returning 0 would mark every GPU pool view "tracked" while the
          #     stub never reports a close -> the grant is never returned (leak).
          #     Non-zero return retires the grant, like a kernel without the patch.
          #   * native_legacy_request_layout is the rejection report's offset table;
          #     zeroes read every field at offset 0, so it carries the same iPadOS 17
          #     fallback values LegacyDisplayProbe.cpp uses.
          #   * ml_static_mfree_prepare returns bool; false keeps release off.
          src = ['/* weak defaults for macOS-only hooks; values match the absent-hook path */',
                 '#define WEAK __attribute__((weak, visibility("hidden")))',
                 'WEAK unsigned long cs_native4k_digest_bytes[2];',
                 'WEAK unsigned long cs_native4k_digest_cpu[2];',
                 'WEAK unsigned long cs_native4k_digest_wall[2];',
                 'WEAK unsigned long cs_native4k_record_ticks;',
                 'WEAK unsigned long cs_native4k_chunk_ticks;',
                 'WEAK unsigned long cs_native4k_read_ticks;',
                 'WEAK unsigned long cs_native4k_hash_ticks;',
                 'WEAK unsigned long cs_native4k_bytes;',
                 'WEAK unsigned long cs_native4k_ready_blobs;',
                 'WEAK unsigned long cs_native4k_chunks_made;',
                 'WEAK const unsigned native_legacy_request_layout[6] = {17, 81, 792, 804, 816, 2624};',
                 'WEAK long ml_static_mfree_prepare(void) { return 0; }',
                 'WEAK long iokit_physical_descriptor_close_notify(void) { return -1; }',
                 'WEAK void sheng_ethernet_probe(void) {}',
                 'WEAK void sheng_software_aes_probe(void) {}',
                 'WEAK long native_hooks_stub_marker(void) { return 0; }']
          path = pathlib.Path('ci-device-stubs.c')
          path.write_text(chr(10).join(src) + chr(10))
          sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'], text=True).strip()
          obj = pathlib.Path(subprocess.check_output(['pwd'], text=True).strip()) / 'ci-device-stubs.o'
          subprocess.run(['xcrun', 'clang', '-arch', 'arm64e', '-mkernel', '-isysroot', sdk,
                          '-c', '-o', str(obj), str(path)], check=True)
          print('compiled weak stubs ->', obj, os.path.getsize(obj), 'bytes')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CI_DEVICE_STUBS=' + str(obj) + chr(10))
          PY
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          t = p.read_text()
          old = 'KERNEL_EXTRA_ARCHIVES="-L$KERNEL_SDKROOT/usr/local/lib/kernel -lfirehose_kernel $CRYPTO_ARCHIVE"'
          forced = [
              'native_source_storage_start',
              'native_verified_block_root_authorized',
              'native_verified_block_manifest_sha384',
              'native_verified_block_volume_device',
              'native_ram_block_volume_seed',
              'native_ram_block_gpu_addon',
              'sheng_boot_watchdog_policy',
          ]
          new = ('KERNEL_EXTRA_ARCHIVES="-L$KERNEL_SDKROOT/usr/local/lib/kernel -lfirehose_kernel $CRYPTO_ARCHIVE'
                 + ''.join(' -Wl,-u,_%s' % n for n in forced)
                 + '${CI_DEVICE_STUBS:+ -Wl,-force_load,$CI_DEVICE_STUBS}"')
          if 'CI_DEVICE_STUBS' in t:
              print('baseline script: already patched')
          elif old not in t:
              raise SystemExit('baseline script: KERNEL_EXTRA_ARCHIVES anchor not found')
          else:
              p.write_text(t.replace(old, new, 1))
              print('baseline script: CI_DEVICE_STUBS force-load added')
          PY
      - name: patch fileset reference stubs (device hook prefixes)
        # PIT (run 43397482308): build-fileset-release-reference.py auto-stubs only
        # native_* undefined weak symbols. Device main's newer code also references
        # cs_native4k_* (BootLog digests), iokit_physical_descriptor_*,
        # ml_static_mfree_prepare and sheng_* probes (ethernet, software_aes), so the
        # comparison kernel's second link failed and archive-20 aborted the run.
        # The comparison kernel never runs - the prelink step only reads its layout -
        # so extending the stub prefix list is safe.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/build-fileset-release-reference.py')
          t = p.read_text()
          old = 'native_[a-z0-9_]+|boot_log_rounds|boot_cache_input_capture'
          new = ('native_[a-z0-9_]+|cs_native4k_[a-z0-9_]+|iokit_[a-z0-9_]+|ml_[a-z0-9_]+|'
                 'sheng_[a-z0-9_]+|boot_log_rounds|boot_cache_input_capture')
          if 'cs_native4k_[a-z0-9_]+' in t:
              print('fileset reference stubs: already patched')
          elif old not in t:
              raise SystemExit('fileset reference: stub regex anchor not found')
          else:
              p.write_text(t.replace(old, new, 1))
              print('fileset reference stubs: prefixes extended (cs_native4k/iokit/ml/sheng)')
          PY
      - name: note on upstream PR 229 (not applied)
        # PR #229 (stoicneko: ipsw AEA decrypt on non-macOS hosts) conflicts with
        # framework main's scripts/unixnu/ipsw.py, and both recovery attempts left
        # conflict markers / unmerged paths in the tree (runs 43385171421 and
        # 43386319771 died on "SyntaxError: <<<<<<< HEAD"). It only helps non-macOS
        # hosts; our packaging/userdata builds run on macOS where /usr/bin/aea is
        # native, so it is tracked upstream and deliberately not applied here.
        run: |
          echo "PR #229 tracked upstream, not applied (conflicts with framework main; no value on macOS)"
      - name: patch adreno inputs retry (503)
        # PIT: archive-12-fetch-adreno-inputs.py pulls SHA-pinned files from
        # raw.githubusercontent.com / chromium.googlesource.com with a single
        # attempt (timeout 30, 4 threads); those hosts intermittently answer 503
        # and killed earlier runs. Patch idempotently: 5 attempts, exponential
        # backoff, timeout 60, 2 threads. Hash checks untouched.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('UniXNU/scripts/fetch-adreno-inputs.py')
          lines = p.read_text().splitlines()
          if any('# UniXNU sheng CI patch' in line for line in lines):
              print('already patched')
          else:
              out = []
              index = 0
              while index < len(lines):
                  line = lines[index]
                  if 'urlopen(request, timeout=30) as response' in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + '# UniXNU sheng CI patch: 503 retry, 5 attempts, 60 s timeout')
                      out.append(indent + 'for attempt in range(5):')
                      out.append(indent + '    try:')
                      out.append(indent + '        with urllib.request.urlopen(request, timeout=60) as response:')
                      out.append(indent + '            data = response.read()')
                      out.append(indent + '        break')
                      out.append(indent + '    except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as error:')
                      out.append(indent + '        if attempt == 4:')
                      out.append(indent + '            raise')
                      out.append(indent + '        print("retry %d/5 after %s: %s" % (attempt + 1, error, path.name), flush=True)')
                      out.append(indent + '        time.sleep(2 ** attempt)')
                      index += 2
                      continue
                  out.append(line)
                  index += 1
              text = chr(10).join(out) + chr(10)
              text = text.replace('import urllib.parse', 'import urllib.error' + chr(10) + 'import urllib.parse', 1)
              text = text.replace('import urllib.request', 'import urllib.request' + chr(10) + 'import time', 1)
              text = text.replace('max_workers=4', 'max_workers=2', 1)
              # Assertion: the three textual replacements must all land; a silent
              # no-op here produced a failed fetch in earlier runs.
              assert 'import urllib.error' + chr(10) + 'import urllib.parse' in text, 'urllib.error import not inserted'
              assert 'import urllib.request' + chr(10) + 'import time' in text, 'time import not inserted'
              assert 'max_workers=2' in text and 'max_workers=4' not in text, 'max_workers not replaced'
              assert 'for attempt in range(5):' in text, 'retry loop not inserted'
              p.write_text(text)
              print('adreno fetch patched: 5 retries, timeout 60, 2 threads (assertions ok)')
          PY
      - name: repair Mesa patch header
        # UniXNU 82b847c: turnip-frame-diagnostics.patch creates tu_frame_diagnostic.h without the "new file mode"
        # line, so git apply stops at dev/null. UniXNU e7c359c adds exactly that line; add it here for the pinned revision.
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('patches/mesa/turnip-frame-diagnostics.patch')
          head = 'diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\n--- /dev/null\n'
          text = path.read_text()
          if text.startswith(head):
              path.write_text(text.replace(head, head.replace('\n--- ', '\nnew file mode 100644\n--- ', 1), 1))
              print('added the new file mode line')
          elif 'new file mode 100644' in text.splitlines()[1]:
              print('already has the new file mode line')
          else:
              raise SystemExit('unexpected header of ' + str(path))
          PY
      - name: restore profile default prelink roots (layout fit)
        # ROOT CAUSE (run 43528673031): device main's board.toml adds an
        # ["os_overrides"."ipados-27.0.1-24A446"."kernel"."prelink"] section whose
        # roots retain 13 extra kexts (IOUSBDeviceFamily, AppleUSBXDCI,
        # AppleUSBDeviceMux, IOUSBHostFamily, AppleUSBXHCI, AppleUSBHub,
        # AppleUSBHostCompositeDevice, IOUSBHostHIDDevice, IOUSBMassStorageDriver,
        # IOSCSIArchitectureModelFamily, IOSCSIBlockCommandsDevice,
        # AppleOnboardSerial, AppleSMC). XnuPrelink places retained kext code
        # inside native __TEXT_EXEC before the native kernel
        # (fileset_layout.py: end_kept = max end of retained __TEXT_EXEC), so the
        # extra kexts pushed native code past the collection's __DATA:
        # "Native code would collide with collection data". The proven generation
        # (run 43449862147) used the 31 profile default roots and kept ~160 KiB of
        # slack. Delete the override so the profile defaults apply again. The USB
        # host stacks are not needed for this run's diagnostics: QcomDwc3 is not in
        # the 27 archives list and the native dwc3 probe stays parked
        # (INCLUDE_DWC3_PROBE=0).
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/board.toml')
          t = p.read_text()
          marker = '["os_overrides"."ipados-27.0.1-24A446"."kernel"."prelink"]'
          if marker not in t:
              print('board.toml: prelink override absent; nothing to restore')
          else:
              start = t.index(marker)
              # The section ends at the next TOML table header (a line starting with '['
              # after the roots assignment) or EOF.
              rest = t[start + len(marker):]
              nxt = rest.find(chr(10) + '[')
              end = start + len(marker) + (nxt if nxt >= 0 else len(rest))
              removed = t[start:end]
              if '"roots"' not in removed:
                  raise SystemExit('board.toml: override section without roots; inspect manually')
              p.write_text(t[:start] + t[end:])
              print('board.toml: removed 27-profile prelink roots override (%d bytes);'
                    ' profile defaults (31 roots) restored' % len(removed))
          PY
          python3 - <<'PY'
          # Assertion: after the patch the board must carry no 27-profile prelink
          # roots, so the framework falls back to profiles/os/ipados-27.0.1-24A446.
          import pathlib
          t = pathlib.Path('device/board.toml').read_text()
          marker = '["os_overrides"."ipados-27.0.1-24A446"."kernel"."prelink"]'
          assert marker not in t, 'prelink roots override still present'
          print('assertion ok: 27-profile prelink roots override absent')
          PY
      - name: sheng ABL device tree (0x218 symbols)
        # Official main's sheng-abl-dtb.py adds splash_region via fdtput; the result carries no
        # /__symbols__ (dtc without -@), so ABL's dtbo_a overlay fixups all fail and it returns to
        # fastboot (the black screen we proved on the real device). Mirror niuzicheng666's
        # fetch-babylon-abldtb.py: copy the vendor_boot base tree that carries __symbols__, select
        # msm-id 0x218 (this handset ABL "Chiptype: 536"), overwrite build/sheng/sheng.dtb, then add
        # the step to board.toml preflight AFTER check-sheng.py.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PIT: raw.githubusercontent.com failed DNS resolution on the runner
          # (run 43395310378). Fetch through the API with the workflow token first;
          # fall back to raw with retries.
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request
          ref = 'b87a4cb89377914fdb0e11482a3e9221491db817'
          api = ('https://api.github.com/repos/niuzicheng666-source/UniXNU-sheng/'
                 'contents/scripts/fetch-babylon-abldtb.py?ref=' + ref)
          req = urllib.request.Request(api, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ.get('GITHUB_TOKEN', ''),
              'User-Agent': 'sheng-ci'})
          try:
              data = json.loads(urllib.request.urlopen(req, timeout=60).read())
              blob = base64.b64decode(data['content'])
              open('device/scripts/fetch-sheng-abldtb.py', 'wb').write(blob)
              print('fetched fetch-babylon-abldtb.py via api (%d bytes)' % len(blob))
          except Exception as error:
              print('api fetch failed (%s); falling back to raw' % error)
              raw = ('https://raw.githubusercontent.com/niuzicheng666-source/UniXNU-sheng/'
                     + ref + '/scripts/fetch-babylon-abldtb.py')
              subprocess.run(['curl', '-fsSL', '--retry', '5', '--retry-delay', '3',
                              '--retry-connrefused', '-o',
                              'device/scripts/fetch-sheng-abldtb.py', raw], check=True)
              print('fetched via raw')
          PY
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/scripts/fetch-sheng-abldtb.py')
          t = p.read_text()
          t = t.replace('EXPECTED_MSM_ID = (0x207, 0x20000)',
                        'EXPECTED_MSM_ID = (0x218, 0x20000)  # this handset: ABL "Chiptype: 536"')
          t = t.replace("OUTPUT = Path('build/babylon/babylon.dtb')",
                        "OUTPUT = Path('build/sheng/sheng.dtb')")
          p.write_text(t)
          b = pathlib.Path('device/board.toml')
          bt = b.read_text()
          old = '"scripts/import-sheng-uefi.py", "scripts/check-sheng.py"]'
          new = '"scripts/import-sheng-uefi.py", "scripts/check-sheng.py", "scripts/fetch-sheng-abldtb.py"]'
          if old not in bt:
              raise SystemExit('board.toml preflight anchor not found')
          b.write_text(bt.replace(old, new, 1))
          print('fetch-sheng-abldtb.py added AFTER check-sheng.py; board.toml preflight patched')
          PY
      - name: usb diagnostics (usb=2 register sampling + log-sys=1)
        # The QcomDwc3 driver is already in this build: build-gop-legacy-display-27.py
        # compiles drivers/QcomDwc3/QcomDwc3.cpp and package/UsbProbe.cpp
        # unconditionally, package/LegacyDisplayProbe.cpp calls the weak_import
        # sheng_usb_probe(), and kernel_args already carry usb=1.
        # What is missing is visibility: board.toml never sets log-sys, so none of the
        # native_usb_stats [usb] boot rows are printed, and usb=1 performs no register
        # sampling. usb=2 adds it (usb=3 would also take the controller off the bus and
        # back once).
        # Idempotent, and it only rewrites the kernel_args arrays that already carry usb.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/board.toml')
          t = p.read_text()
          pieces = t.split('"kernel_args" = [')
          if len(pieces) < 2:
              raise SystemExit('usb diagnostics: no kernel_args array in board.toml')
          out = [pieces[0]]
          touched = 0
          for chunk in pieces[1:]:
              body, brk, tail = chunk.partition(']')
              if not brk:
                  raise SystemExit('usb diagnostics: unterminated kernel_args array')
              args = [a.strip() for a in body.split(',')]
              if '"usb=1"' in args or '"usb=2"' in args:
                  args = ['"usb=2"' if a == '"usb=1"' else a for a in args]
                  if '"log-sys=1"' not in args:
                      args.append('"log-sys=1"')
                  touched += 1
                  out.append('"kernel_args" = [' + ', '.join(args) + ']' + tail)
              else:
                  out.append('"kernel_args" = [' + body + ']' + tail)
          if not touched:
              raise SystemExit('usb diagnostics: no kernel_args array carries usb=1')
          t2 = ''.join(out)
          if t2 != t:
              p.write_text(t2)
          print('usb diagnostics: %d kernel_args arrays -> usb=2 + log-sys=1' % touched)
          PY
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path('device/board.toml').read_text()
          if '"usb=1"' in t:
              raise SystemExit('usb diagnostics: usb=1 still present')
          hits = 0
          for chunk in t.split('"kernel_args" = [')[1:]:
              body = chunk.split(']')[0]
              args = [a.strip() for a in body.split(',')]
              if '"usb=2"' in args:
                  hits += 1
                  if '"log-sys=1"' not in args:
                      raise SystemExit('usb diagnostics: log-sys=1 missing')
          if hits != 2:
              raise SystemExit('usb diagnostics: expected 2 arrays with usb=2, got %d' % hits)
          print('usb diagnostics verified: %d arrays carry usb=2 + log-sys=1' % hits)
          PY
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: WCN7850 firmware
        # firmware/wcn7850 holds only the manifest; the binaries stay out of Git. The pinned linux-firmware commit carries
        # exactly the files the manifest pins (sizes and SHA-256 checked below; any difference stops the run).
        working-directory: device
        env:
          LINUX_FIRMWARE: 575bbe3f83565d18caa73e9b9458f754dd286f48 # linux-firmware: ath12k WCN7850 hw2.0 update board-2.bin
        run: |
          for name in amss.bin m3.bin board-2.bin; do
            curl -fsSL --retry 3 -o "firmware/wcn7850/$name" \
              "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath12k/WCN7850/hw2.0/$name?id=$LINUX_FIRMWARE" ||
            curl -fsSL --retry 3 -o "firmware/wcn7850/$name" \
              "https://gitlab.com/kernel-firmware/linux-firmware/-/raw/$LINUX_FIRMWARE/ath12k/WCN7850/hw2.0/$name"
          done
          python3 - <<'PY'
          import hashlib, json, pathlib
          folder = pathlib.Path('firmware/wcn7850')
          for name, want in json.loads((folder / 'manifest.json').read_text())['files'].items():
              data = (folder / name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != want['bytes'] or digest != want['sha256']:
                  raise SystemExit(f'{name}: {len(data)} bytes sha256 {digest} differs from firmware/wcn7850/manifest.json')
              print(f'{name}: {len(data)} bytes sha256 {digest} matches the manifest')
          PY
      - name: device inputs
        # The runtime step runs before the firmware step, so inputs a developer checkout already holds are fetched here:
        # the proprietary-files.txt entries from its pinned @fetch mirror (SHA-256 checked) and the sources Ath12kWifi
        # locks in tools/source-lock.json (commits and archive SHA-256 checked by fetch-sources.py).
        working-directory: device
        run: |
          python3 scripts/extract-files.py
          python3 scripts/extract-files.py --check
          # fetch-sources.py clones with --sparse (cone mode by default in current git), then runs
          # `sparse-checkout add` with the lock's leading-slash patterns, which cone mode rejects. Create the two
          # locked clones in non-cone mode first; fetch-sources.py then verifies their commits and contents.
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('drivers/Ath12kWifi')
          lock = json.loads((root / 'tools/source-lock.json').read_text())
          for name in ('linux', 'freebsd'):
              source, directory = lock[name], root / 'deps' / name
              if directory.exists():
                  continue
              directory.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'clone', '--depth', '1', '--branch', source['ref'], '--filter=blob:none', '--sparse',
                              source['url'], str(directory)], check=True)
              subprocess.run(['git', '-C', str(directory), 'sparse-checkout', 'set', '--no-cone', *source['paths']], check=True)
          PY
          python3 drivers/Ath12kWifi/tools/fetch-sources.py
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: assert ABL dtb (0x218 + __symbols__)
        # The ABL step only installs the fetcher into board.toml preflight, so the
        # tree is produced during `package`. It overwrites build/sheng/sheng.dtb
        # AFTER check-sheng.py validated the stock tree, i.e. the validated file is
        # not the shipped one. Assert the shipped tree here, right after package and
        # before anything is cached/uploaded: a tree without /__symbols__ makes
        # ABL's dtbo overlay fail and bounces the handset back to fastboot.
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('device/build/sheng/sheng.dtb')
          if not p.is_file():
              raise SystemExit('sheng.dtb missing: the ABL dtb step produced nothing')
          data = p.read_bytes()
          problems = []
          if data[:4] != bytes([0xd0, 0x0d, 0xfe, 0xed]):
              problems.append('wrong fdt magic')
          if b'__symbols__\x00' not in data:
              problems.append('no __symbols__ node (ABL dtbo overlay would fail)')
          if len(data) < 400000:
              problems.append('only %d bytes; the vendor_boot 0x218 tree is ~506 KB' % len(data))
          if problems:
              raise SystemExit('ABL dtb assertion failed: ' + '; '.join(problems))
          print('abl dtb ok: %d bytes, __symbols__ present' % len(data))
          PY
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
      - name: build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.os }}
          retention-days: 2
          if-no-files-found: warn
          path: UniXNU/out/sheng/*/*/logs/
