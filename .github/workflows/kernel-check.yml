name: kernel-check
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU-sheng
          path: device
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: brew install llvm lld mtools dtc unifdef
      - run: echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
      - name: Patch upstream REFERENCES (IOHIDFamily missing for OS27)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/unixnu/cli.py')
          t = p.read_text()
          old = "'IOStorageFamily'), 'package'"
          new = "'IOStorageFamily', 'IOHIDFamily'), 'package'"
          assert old in t, 'REFERENCES line not found in scripts/unixnu/cli.py'
          p.write_text(t.replace(old, new, 1))
          print('patched: IOHIDFamily added to REFERENCES[kernel]')
          PY
      - id: k
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig sheng_ipados27_defconfig
          ./unixnu build kernel
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.k.outcome }}
          RID: ${{ github.run_id }}
        run: |
          { echo "kernel=$OUT"; find out -path '*/logs/*.log' 2>/dev/null | while read -r f; do echo "=== $f"; tail -n 200 "$f"; done; } > r.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/ci-logs -f sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)" >/dev/null 2>&1 || true
          c=$(base64 < r.md | tr -d '\n')
          s=$(gh api "repos/$GITHUB_REPOSITORY/contents/ci/r-$RID.md?ref=ci-logs" --jq .sha 2>/dev/null || true)
          if [ -n "$s" ]; then gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci/r-$RID.md" -f message=ci -f content="$c" -f branch=ci-logs -f sha="$s" >/dev/null; else gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci/r-$RID.md" -f message=ci -f content="$c" -f branch=ci-logs >/dev/null; fi
