name: kernel-check
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU-sheng
          path: device
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: brew install llvm lld mtools dtc unifdef
      - run: echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
      - name: Patch upstream gaps (IOHIDFamily fetch + sm8550 pin)
        run: |
          git -C device submodule update --init --depth 1 drivers/Ath12kWifi
          python3 - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          # 1) REFERENCES[kernel] lacks IOHIDFamily -> refer/IOHIDFamily never fetched
          p = Path('scripts/unixnu/cli.py')
          t = p.read_text()
          old = "'IOStorageFamily'), 'package'"
          new = "'IOStorageFamily', 'IOHIDFamily'), 'package'"
          assert old in t, 'REFERENCES line not found in scripts/unixnu/cli.py'
          p.write_text(t.replace(old, new, 1))
          print('patched: IOHIDFamily added to REFERENCES[kernel]')
          # 2) device feeds pin is stale: BluetoothProbe.cpp needs Sm8550GeniUart.h,
          #    added in sm8550-common 009512d6+; the pin a9f45dc6 predates it
          OLD = 'a9f45dc60c035084b95463781538380f4c3606c9'
          NEW = '97665e28578483082b674e8375a8fa65f4cf49cf'
          for f in ('device/feeds.toml', 'device/unixnu.lock'):
              q = Path(f)
              if q.is_file() and OLD in q.read_text():
                  q.write_text(q.read_text().replace(OLD, NEW))
                  print('patched:', f)
          # 3) fetch-sources.py passes leading-slash patterns to cone-mode
          #    sparse-checkout (git >= 2.26 rejects them). Use non-cone set.
          q = Path('device/drivers/Ath12kWifi/tools/fetch-sources.py')
          s = q.read_text()
          old = '"sparse-checkout", "add", *source["paths"]'
          new = '"sparse-checkout", "set", "--no-cone", *source["paths"]'
          assert old in s, 'sparse-checkout call not found in fetch-sources.py'
          q.write_text(s.replace(old, new, 1))
          print('patched: fetch-sources.py sparse-checkout -> set --no-cone')
          # 4) The ipados OS patch series is stale: device/framework code calls xnu hooks
          #    (cs_native4k_*, ml_static_mfree_prepare, iokit_physical_descriptor_close_notify)
          #    that only the macOS profile's shared patches define. Add them in macos order.
          shared = ['cshash-native4k-stats.patch', 'payload-addon-release.patch',
                    'cshash-native4k-parallel.patch', 'cshash-native4k-lazy.patch',
                    'cssha-digest-time.patch', 'gpupool-device-pager-close.patch',
                    'memwired-kc-segment-release.patch']
          src = Path('profiles/os/macos-27.3-26C5035r/patches/xnu-12377')
          dst = Path('profiles/os/ipados-27.0.1-24A446/patches/xnu-12377')
          dst.mkdir(exist_ok=True)
          series = Path('profiles/os/ipados-27.0.1-24A446/patches/xnu/series')
          lines = series.read_text().rstrip('\n') + '\n'
          for name in shared:
              shutil.copy(src / name, dst / name)
              lines += f'../xnu-12377/{name}\n'
          series.write_text(lines)
          print('patched: ipados OS series +7 shared xnu-12377 patches')
          # 5) weak_import probes: arm64e kernel links reject undefined weak symbols.
          #    CI stubs restore the documented non-macOS fallbacks (empty probes, iOS17 layout).
          Path('ci-stubs').mkdir(exist_ok=True)
          Path('ci-stubs/ci-stubs.c').write_text(
              '/* CI shims: probes are weak_import and macOS-only in the sources. */\n'
              'void sheng_ethernet_probe(void) {}\n'
              'void sheng_software_aes_probe(void) {}\n'
              'const unsigned native_legacy_request_layout[6] = {17, 81, 792, 804, 816, 2624};\n')
          sdk = subprocess.run(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'],
                               capture_output=True, text=True, check=True).stdout.strip()
          subprocess.run(['xcrun', 'clang', '-target', 'arm64e-apple-ios27.0', '-isysroot', sdk,
                          '-c', 'ci-stubs/ci-stubs.c', '-o', 'ci-stubs/ci-stubs.o'], check=True)
          subprocess.run(['xcrun', 'ar', 'rcs', 'ci-stubs/libCiStubs.a', 'ci-stubs/ci-stubs.o'], check=True)
          cfg = Path('device/configs/sheng_ipados27_defconfig')
          t = cfg.read_text()
          old = '"-Wl,-force_load,{tree}/build/sheng-source-storage/libShengSourceStorage.a"'
          new = (old[:-1] + ' -Wl,-force_load,' + str(Path('ci-stubs/libCiStubs.a').resolve()) + '"')
          assert old in t, 'EXTRA_LD_ARCHIVES line not found in sheng_ipados27_defconfig'
          cfg.write_text(t.replace(old, new, 1))
          print('patched: defconfig EXTRA_LD_ARCHIVES += libCiStubs.a')
          print('patch done')
          PY
      - name: Fetch proprietary firmware (public mirror, sha256-verified)
        run: python3 device/scripts/extract-files.py
      - id: k
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig sheng_ipados27_defconfig
          ./unixnu build kernel
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.k.outcome }}
          RID: ${{ github.run_id }}
        run: |
          { echo "kernel=$OUT"; find out -path '*/logs/*.log' 2>/dev/null | while read -r f; do echo "=== $f"; tail -n 200 "$f"; done; } > r.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/ci-logs -f sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)" >/dev/null 2>&1 || true
          c=$(base64 < r.md | tr -d '\n')
          s=$(gh api "repos/$GITHUB_REPOSITORY/contents/ci/r-$RID.md?ref=ci-logs" --jq .sha 2>/dev/null || true)
          if [ -n "$s" ]; then gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci/r-$RID.md" -f message=ci -f content="$c" -f branch=ci-logs -f sha="$s" >/dev/null; else gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ci/r-$RID.md" -f message=ci -f content="$c" -f branch=ci-logs >/dev/null; fi
